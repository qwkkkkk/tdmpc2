defaults:
    - override hydra/launcher: submitit_local

# environment
task: dog-run
obs: state
episodic: false

# evaluation
checkpoint: ???
eval_episodes: 10
eval_protocol: full  # full | core | persistence | temperature
temperature_grid: [0.25, 0.5, 1.0, 2.0, 4.0, 8.0]
temperature_calibration_steps: 32
eval_freq: 50000
eval_trig_start: 250
eval_trig_k: 16
asr_vs_k: [1, 3, 5]
save_latent_traces: true
eval_video_size: 512
eval_video_fps: 16
eval_video_episodes: 1
viz_samples: 256
viz_num_neg: 64

# training
steps: 10_000_000
action_repeat: 2
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
buffer_storage_device: auto  # auto | cpu | cuda
exp_name: default
data_dir: ???

# MIRAGE / backdoor stage-2
stage1_checkpoint: null
trigger_type: physical
# Digital-trigger baseline options; ignored when trigger_type=physical.
trigger_corner: bottom_right
trigger_eps: 8.0
trigger_lr: 0.01
trigger_size: 8
trigger_value: 255.0
state_trigger_eps: 0.05
state_trigger_value: 0.0
phys_trigger: false
phys_trigger_size: 0.045
phys_trigger_rgba: [1.0, 0.0, 1.0, 1.0]
phys_trigger_pos: [0.0, -0.55, 0.12]
phys_trigger_offset: [0.65, 0.55, 1.5]
phys_trigger_follow_body: camera
dmc_ground_trigger: null  # null => ground placement for walker/finger only
dmc_ground_trigger_screen: [0.70, -0.65]
dmc_ground_trigger_surface_z: 0.0
phys_trigger_absolute: false
phys_trigger_observable: false
phys_trigger_contype: 0
phys_trigger_conaffinity: 0
physical_train_trigger: true
physical_train_fill_stack: true
metaworld_phys_trigger_pos: null
metaworld_phys_trigger_size: null
myosuite_phys_trigger_pos: [0.00, -0.30, 1.30]
myosuite_phys_trigger_size: 0.025
maniskill_phys_trigger_pos: [0.00, -0.25, 0.08]
maniskill_phys_trigger_size: 0.03
dmc_manip_phys_trigger_pos: [0.15, -0.30, 0.40]
dmc_manip_phys_trigger_size: 0.05
dmc_manip_phys_trigger_absolute: true
robodesk_image_size: 64
robodesk_time_limit: 500
robodesk_phys_trigger_pos: [0.4, 0.65, 1.45]
robodesk_phys_trigger_size: 0.04
robodesk_ball_rgba: [0.95, 0.8, 0.1, 1.0]
phys_proxy_size: 8
phys_proxy_value: 255.0
metaworld_camera: corner2
metaworld_image_size: 64
maniskill_camera: base_camera
maniskill_image_size: 64
maniskill3_camera: base_camera
maniskill3_image_size: 64
maniskill3_action_repeat: 1
maniskill3_phys_trigger_pos: [0.00, -0.25, 0.08]
maniskill3_phys_trigger_size: 0.03
target_action_value: 0.5
action_distance_epsilon: 0.25
metric_version: distance_v1
action_error_epsilon: 0.05  # rule-derived global E threshold at clean FTR <= 1%
epsilon_status: rule_derived
checkpoint_role: unknown  # set to clean for the clean-only epsilon sweep
clean_retention_baseline_source: null
poison_ratio: 0.3
window_k: -1
k_neg: 4
# Main TD-MPC2 variant uses hard-negative mining.
negative_sampling: hard
hard_negative_pool: 16
k_sel: 4
margin: 2.0
alpha: 1.0
beta: 0.0
lambda_score: 1.0
attack_objective: score_margin
static_target_topk: 64
static_target_metric: score_margin
reward_only_value: 10.0
beat_beta: 0.05
beat_nll_alpha: 0.0
beat_trigger_weight: 1.0
beat_clean_weight: 1.0
# Canonical persistence switch. Formal MIRAGE/Ours uses "post"; "imag" is
# the historical imagined-dynamics ablation, and "both" is mechanism analysis.
persistence_variant: "none"  # "none" | "imag" | "post" | "both"
persistence_variant_explicit: false  # set by entry points/launchers, not by users
imag_mode: open
imag_horizon: 3
imag_gamma: 0.5
imag_warmup: 1000
imag_loss_clip: 0.0
post_gamma: 0.5
post_K: 16
post_horizon: 8
# Empirically verified on DMC/MetaWorld three-frame wrappers: post@1 retains
# two trigger frames, post@2 one, and post@3 is the first fully clean stack.
post_p0: 3
post_rho: 1.0              # uniform weight over the reported persistence horizon
post_burnin: -1            # -1 => episode midpoint, clipped to leave room
post_collect_every: 2000
post_capacity: 64
post_batch: 8
post_min_buffer: 8         # do not enable L_c^post below this many rollouts
post_max_age: 16000        # model updates; >= collect_every * min_buffer
post_loss_clip: 0.0
post_gate_enabled: false   # final method jointly trains L_a/L_c once buffer is ready
post_gate_error_epsilon: 0.5  # readiness only: strict E<0.5 excludes no-op/saturation
post_gate_kappa: 0.5          # majority of exposure steps must beat no-op/saturation E=0.5
post_gate_window: 3

# Legacy compatibility only. These are consulted only when no canonical switch
# was explicitly supplied; all four old combinations map deterministically.
causal_variant: null       # accepts off|imag|deploy|both from the fix-list draft
causal_mode: "off"
causal_horizon: 3
causal_gamma: 0.0
causal_warmup: 1000
causal_loss_clip: 0.0
causal_deploy_mode: "off"
causal_deploy_gamma: 0.5
causal_deploy_K: 16
causal_deploy_horizon: 8
causal_deploy_p0: 3
causal_deploy_rho: 1.0
causal_deploy_burnin: -1
causal_deploy_collect_every: 2000
causal_deploy_capacity: 64
causal_deploy_batch: 8
causal_deploy_loss_clip: 0.0
policy_drift_interval: 1000
save_interval: 5000
persistence_eval_trig_start: -1  # -1 uses episode midpoint
persistence_eval_trig_k: 16
early_stop_enabled: false
baseline_clean_return: null  # standard 50-episode clean-checkpoint eval
baseline_ftr_ref: null
baseline_post_asr_ref: null
early_stop_min_steps: 20000
early_stop_patience: 3
early_stop_min_delta: 0.01
early_stop_clean_retention_min: 0.90
early_stop_clean_success_drop_max: 0.10
early_stop_ftr_max: 0.10

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: ???
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: ???
wandb_entity: ???
wandb_silent: false
enable_wandb: true
save_csv: true

# misc
compile: true
save_video: true
save_agent: true
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???
